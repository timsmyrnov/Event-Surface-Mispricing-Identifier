[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = 'esmi'
version = '0.1.0'
description = 'Event Surface Mispricing Identifier'
readme = 'README.md'
requires-python = '>=3.11'

[tool.setuptools]
package-dir = {'' = 'src'}

[tool.setuptools.packages.find]
where = ['src']
